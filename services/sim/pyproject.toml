[project]
name = "worldsim-sim"
version = "0.2.0"
description = "Worldsim simulation service: scenario parsing, domain modules, ensembles, persona cognition, reporting."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "numpy>=2.0", "pydantic>=2.8", "duckdb>=1.1", "httpx>=0.27", "anthropic>=0.70"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
